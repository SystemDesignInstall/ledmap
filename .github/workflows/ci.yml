name: CI

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:licenses
      - run: node scripts/check-audit.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: xvfb-run -a npm run test:smoke

  package-win:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: LedMAP-win-x64-portable
          path: packages/app/dist/*.exe
          if-no-files-found: error
