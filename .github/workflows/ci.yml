name: CI

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:licenses
      - run: node scripts/check-audit.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: xvfb-run -a npm run test:smoke

  package-win:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compile NDI sender and stage official runtime / notices
        shell: pwsh
        run: ./scripts/build-ndi-windows.ps1
      - run: npm run package
      - name: Assert native NDI assets were staged
        shell: pwsh
        run: |
          foreach ($name in @('ledmap-ndi-sender.exe', 'Processing.NDI.Lib.x64.dll',
                              'Processing.NDI.Lib.Licenses.txt', 'NDI-SDK-License-Agreement.pdf')) {
            if (-not (Test-Path (Join-Path 'packages/app/build/ndi' $name))) {
              throw "Missing NDI resource: $name"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LedMAP-win-x64-portable-NDI-bundled
          path: packages/app/dist/*.exe
          if-no-files-found: error
